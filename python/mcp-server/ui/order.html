<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Order</title>
    <style>
      /* Host style variables when the client sends them, plain defaults otherwise. */
      :root {
        --bg: var(--color-background-primary, #ffffff);
        --subtle: var(--color-background-secondary, #f5f5f4);
        --text: var(--color-text-primary, #1c1917);
        --muted: var(--color-text-secondary, #78716c);
        --border: var(--color-border-primary, #e7e5e4);
        --font: var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif);
      }
      :root[data-theme="dark"] {
        --bg: var(--color-background-primary, #1c1917);
        --subtle: var(--color-background-secondary, #292524);
        --text: var(--color-text-primary, #f5f5f4);
        --muted: var(--color-text-secondary, #a8a29e);
        --border: var(--color-border-primary, #44403c);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: transparent; color: var(--text); font: 14px/1.45 var(--font); }
      .card { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
      .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
      .id { font-weight: 600; }
      .status { padding: 2px 8px; border-radius: 999px; background: var(--subtle); font-size: 12px; font-weight: 600; text-transform: capitalize; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: 12px 0 0; }
      dt { color: var(--muted); }
      dd { margin: 0; }
      .note { color: var(--muted); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main class="card" aria-live="polite">
      <div class="head">
        <span class="id" id="id">Order</span>
        <span class="status" id="status" hidden></span>
      </div>
      <dl id="details" hidden>
        <dt>Customer</dt><dd id="customer"></dd>
        <dt>Item</dt><dd id="item"></dd>
        <dt>Total</dt><dd id="total"></dd>
      </dl>
      <p class="note" id="note">Looking up the order…</p>
    </main>
    <script type="module" src="./src/order.ts"></script>
  </body>
</html>
