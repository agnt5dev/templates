[project]
name = "agnt5-mcp-server"
version = "0.1.2"
description = "AGNT5 MCP server starter: a function, a workflow and an agent published as MCP tools"
authors = [
    { name = "AGNT5 Devs", email = "devs@agnt5.com" }
]
dependencies = [
    "agnt5~=0.14.5",
]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["agnt5", "mcp", "mcp-server", "workflow", "agent"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/agnt5/agnt5"
Documentation = "https://docs.agnt5.com"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/agnt5_mcp_server"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
