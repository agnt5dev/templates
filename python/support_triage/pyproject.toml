[project]
name = "agnt5-support-triage"
version = "0.1.0"
description = "AGNT5 support triage: classify a ticket, check the order, ask a human before large refunds, and draft a reply with a tool-calling agent"
authors = [
    { name = "AGNT5 Devs", email = "devs@agnt5.com" }
]
dependencies = [
    "agnt5~=0.14.5",
]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["agnt5", "workflow", "agent", "human-in-the-loop", "support"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/agnt5/agnt5"
Documentation = "https://docs.agnt5.com"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/agnt5_support_triage"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
