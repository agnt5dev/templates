[project]
name = "agnt5-incident-responder"
version = "0.1.0"
description = "AGNT5 incident responder: a durable investigate-approve-fix workflow you can crash on purpose"
authors = [
    { name = "AGNT5 Devs", email = "devs@agnt5.com" }
]
dependencies = [
    "agnt5~=0.14.5",
    "pydantic>=2",
]
readme = "README.md"
requires-python = ">=3.12"
keywords = ["agnt5", "workflow", "durable-execution", "replay", "human-in-the-loop"]

[project.urls]
Homepage = "https://github.com/agnt5/agnt5"
Documentation = "https://docs.agnt5.com"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_responder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
